<!doctype html>
<meta charset="utf-8">
<title>Starter film</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;height:100%;background:#0c0c0b;display:grid;place-items:center}canvas{max-width:100vw;max-height:100vh}</style>
<canvas id="c"></canvas>
<script src="../lib/motion.js"></script>
<script>
// A film is this one file. window.seek(t) paints frame t, as a pure function of t.
// Double-click to preview. Render: node scripts/render.mjs films/<name>.html
// Rules: no Math.random (use rng), no timers, no CSS animation, no state between frames.

// ── settings ──
window.DUR = 12;                                   // seconds
window.BPM = 120;                                  // beat grid: b(n) = time of beat n
const TITLE = 'Your film';
const C = { bg: '#141413', ink: '#F0EEE6', dim: '#8A887F', accent: '#D97757' };   // one accent

// ── stage: size comes from the renderer (?w=&h=), so 9:16, 1:1 and 16:9 share one timeline ──
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1920, u = Math.min(W, H) / 1080;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const b = (n) => n * 60 / BPM;
const font = (size, weight = 800, face = 'Inter') => `${weight} ${size * u}px "${face}", system-ui, sans-serif`;
window.ready = Promise.all(['800 10px Inter', '500 10px Inter', '700 10px "Source Serif 4"']
  .map((f) => document.fonts.load(f).catch(() => {})));

// ── sound: an original beat bed + a hit for every visual event ──
window.CUES = [
  ...beatBed(BPM, DUR),
  { t: 0, type: 'thump' }, ...[0, 1, 2, 3, 4, 5].map((i) => ({ t: i * b(0.25), type: 'tick' })),
  { t: b(7), type: 'whoosh' }, ...[8, 9, 10, 11].map((n) => ({ t: b(n), type: 'pop', gain: 0.6 })),
  { t: b(12), type: 'whoosh' }, ...[14, 15, 16].map((n) => ({ t: b(n), type: 'click' })),
  { t: b(18), type: 'thump' }, { t: b(19), type: 'chime' },
];

// ── scenes: from/to in seconds, draw(t) gets local time ──
const SCENES = [
  { from: 0, to: b(8.5), draw(t) {                          // 1. hook: letters rise out of a slot
      const word = 'MOTION', size = Math.min(230, (W * 0.84) / u / 4.4), x0 = W * 0.08, y = H * 0.55;
      g.translate(0, -H * spring(t - b(7), 170, 26));        // push up into the next shot
      g.save(); g.beginPath(); g.rect(0, y - size * u * 0.8, W, size * u * 0.84); g.clip();
      g.font = font(size); let x = x0;
      for (let i = 0; i < word.length; i++) {
        const s = spring(t - i * b(0.25), 260, 34);
        g.fillStyle = C.ink; g.fillText(word[i], x, y + (1 - s) * size * u);
        x += g.measureText(word[i]).width;
      }
      g.restore();
      g.fillStyle = C.accent; g.fillRect(x0, y + 34 * u, (x - x0) * spring(t - b(2), 320, 30), 16 * u);
      g.font = font(44, 500); g.fillStyle = C.dim;
      g.fillText('made with code', x0, y + 120 * u + (1 - spring(t - b(3), 260, 34)) * 40 * u);
  }},
  { from: b(7), to: b(12.5), draw(t, T) {                  // 2. staggered grid that collapses to one square
      const cols = W > H ? 10 : 6, cell = (W * 0.8) / cols, rows = Math.floor((H * 0.5) / cell), r = rng(7);
      const enter = 1 - spring(t, 170, 26), collapse = spring(T - b(11.5), 200, 26);
      for (let i = 0; i < cols * rows; i++) {
        const gx = W * 0.1 + (i % cols) * cell + cell / 2, gy = H * 0.25 + Math.floor(i / cols) * cell + cell / 2 + enter * H;
        const s = spring(t - Math.floor(i / cols) * 0.05 - r() * 0.1, 260, 20) * (1 - collapse);
        const hot = (i * 7) % 11 === 0, beat = hot ? spring(T - b(Math.floor(T / b(1))), 400, 12) * 0.15 : 0;
        const size = cell * 0.7 * s * (1 + (hot ? 0.15 - beat : 0));
        g.fillStyle = hot ? C.accent : C.ink;
        g.fillRect(gx - size / 2, gy - size / 2, size, size);
      }
      const one = 120 * u * collapse;                          // everything becomes one square
      g.fillStyle = C.accent; g.fillRect(W / 2 - one / 2, H / 2 - one / 2, one, one);
  }},
  { from: b(12.5), to: b(18), draw(t, T) {               // 3. one shape, many targets: track()
      const w = track(T, [[0, 120], [b(13), 520], [b(16), 180], [b(18), W / u * 0.84]]) * u;
      const h = track(T, [[0, 120], [b(13), 150], [b(16), 180], [b(18), 16]]) * u;
      const r = track(T, [[0, 0], [b(13), 75], [b(16), 90], [b(18), 8]]) * u;
      const y = track(T, [[0, H / 2], [b(18), H * 0.5 + 40 * u]]);
      g.fillStyle = C.accent; g.beginPath(); g.roundRect(W / 2 - w / 2, y - h / 2, w, h, Math.min(r, h / 2)); g.fill();
      g.font = font(52, 800); g.fillStyle = C.bg; g.textAlign = 'center';
      g.globalAlpha = swapAlpha(T, b(13), b(16)); g.fillText('idea → video', W / 2, y + 18 * u); g.globalAlpha = 1;
      const tabs = ['idea', 'code', 'video'], tw = 200 * u, tx = W / 2 - tw * 1.5, ty = H / 2 + 260 * u;
      const tabIn = spring(t - b(1), 260, 34) * (1 - spring(T - b(17.5), 260, 34));
      g.globalAlpha = tabIn; g.font = font(46, 500);
      tabs.forEach((s, i) => { g.fillStyle = C.ink; g.fillText(s, tx + tw * (i + 0.5), ty); });
      const bar = indicator(T, [[0, tx], [b(15), tx + tw], [b(16), tx + tw * 2]], tw);   // edges on different springs
      g.fillStyle = C.accent; g.fillRect(bar.left + 30 * u, ty + 24 * u, bar.right - bar.left - 60 * u, 6 * u);
      g.globalAlpha = 1; g.textAlign = 'left';
  }},
  { from: b(18), to: DUR, draw(t) {                         // 4. lockup: heavy spring, no fade-in
      const y = H * 0.5, size = Math.min(130, (W * 0.8) / u / 5);
      g.font = font(size, 700, 'Source Serif 4');
      const bw = track(t, [[0, W * 0.84], [b(1), g.measureText(TITLE).width]]);   // the bar becomes the underline
      g.fillStyle = C.accent; g.beginPath(); g.roundRect(W / 2 - bw / 2, y + 40 * u - 8 * u, bw, 16 * u, 8 * u); g.fill();
      g.save(); g.beginPath(); g.rect(0, y - size * u, W, size * u * 1.1); g.clip();
      g.font = font(size, 700, 'Source Serif 4'); g.fillStyle = C.ink; g.textAlign = 'center';
      g.fillText(TITLE, W / 2 + Math.sin(t * 0.8) * 2 * u, y - 20 * u + (1 - spring(t - b(1), 90, 19)) * size * u);
      g.restore();
      g.font = font(40, 500); g.fillStyle = C.dim; g.textAlign = 'center';
      g.fillText('rendered from code', W / 2, y + 140 * u + (1 - spring(t - b(2), 260, 34)) * 30 * u);
  }},
];

function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.textAlign = 'left';
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  for (const s of SCENES) if (t >= s.from && t < s.to) { g.save(); s.draw(t - s.from, t); g.restore(); }
}
window.seek = (t) => { draw(t); return true; };

// Live preview in a normal browser, off during headless render
if (!navigator.webdriver) window.ready.then(() => {
  const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
});
</script>
