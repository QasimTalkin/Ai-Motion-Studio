<canvas id="c"></canvas>
<script type="module">
// ShinobiMedia.ca · "The Way of the Shinobi" · 136 s at 120 BPM (beat 0.5 s, bar 2 s).
// Shot list: docs/shotlist.md. Style: docs/style_guide.md. Score: score.mjs → audio/score.wav.
// Every screen shown is a real capture of shinobimedia.ca or of a client site it built (assets/img).
import { frameHold, spring, track, trackN, clamp, range, lerp, hash, noise, swapAlpha, indicator, mixColor, SPRING } from '/lib/motion.js';
import { boot } from '/lib/stage.js';

const DUR = 136, BPM = 120;
const B = (n) => (60 / BPM) * n;
const P = {
  bg: '#0a0d10', s1: '#0f1317', s2: '#161b21', s3: '#1f262e', s4: '#2a333c',
  ink: '#edf1f5', dim: '#a9b4bf', muted: '#8592a0', faint: '#6b7784',
  acc: '#e2564e', accT: '#ec6a5e', deep: '#a33530', accInk: '#14090a',
  rule: 'rgba(237,241,245,0.085)', rule2: 'rgba(237,241,245,0.16)', rule3: 'rgba(237,241,245,0.27)',
};
const F = { d: '"Space Grotesk", sans-serif', u: 'Geist, sans-serif', m: '"Geist Mono", monospace' };
const TYPE = [260, 34];                         // type: fast, critically damped, never overshoots
const CAM = [110, 22];                          // camera moves
const at = (from, to, draw) => ({ from, to, draw: (t, S) => draw(t + from, S) });

// ── kit ────────────────────────────────────────────────────────────────────────
function measure(S, str, size, weight, face, tracking = 0) {
  const { g } = S; g.save(); g.font = S.font(size, weight, face); g.letterSpacing = `${tracking * size * S.u}px`;
  const w = g.measureText(str).width; g.restore(); return w;
}
function fit(S, str, weight, face, maxW, maxSize = Infinity, tracking = 0) {
  return Math.min(maxSize, (100 * maxW) / measure(S, str, 100, weight, face, tracking));
}
function wrap(S, str, size, weight, face, maxW, tracking = 0) {
  const out = []; let cur = '';
  for (const w of str.split(' ')) {
    const test = cur ? cur + ' ' + w : w;
    if (cur && measure(S, test, size, weight, face, tracking) > maxW) { out.push(cur); cur = w; } else cur = test;
  }
  if (cur) out.push(cur);

}
// Text that rises out of a mask slot on tIn and leaves upward on tOut.
function rise(S, t, tIn, str, x, y, o, tOut = Infinity) {
  if (t < tIn || !str) return 0;
  const { g, u } = S, h = o.size * u;
  const sIn = spring(t - tIn, TYPE), sOut = t > tOut ? spring(t - tOut, TYPE) : 0;
  if (sOut > 0.999) return 0;

  g.restore(); return w;
}
// Several colored runs on one baseline, rising together. runs: [[str, color], ...]
function riseRuns(S, t, tIn, runs, x, y, o, tOut = Infinity) {
  const total = runs.reduce((a, [s]) => a + measure(S, s, o.size, o.weight, o.face, o.tracking || 0), 0);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  for (const [s, color] of runs) { rise(S, t, tIn, s, cx, y, { ...o, color, align: 'left' }, tOut); cx += measure(S, s, o.size, o.weight, o.face, o.tracking || 0); }
  return total;
}
// Letters rising one after another (16th notes by default).
function riseChars(S, t, tIn, runs, x, y, o, step = B(0.25), tOut = Infinity) {
  const total = runs.reduce((a, [s]) => a + measure(S, s, o.size, o.weight, o.face, o.tracking || 0), 0);
  let cx = o.align === 'center' ? x - total / 2 : x, i = 0;
  for (const [s, color] of runs) for (const ch of s) {
    rise(S, t, tIn + i++ * step, ch, cx, y, { ...o, color, align: 'left' }, tOut);
    cx += measure(S, ch, o.size, o.weight, o.face, o.tracking || 0);
  }
  return total;
}
const mono = (S, str, x, y, size, color, o = {}) => S.text(str, x, y, { size, face: F.m, weight: 500, color, tracking: 0.12, ...o });

// Slate ground with the site's faint grid and a vermilion bloom from the top-right, like its header.
function ground(S, o = {}) {
  const { g, W, H, u } = S;
  g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
  const step = 72 * u, oy = ((o.gy || 0) % step + step) % step, ox = ((o.gx || 0) % step + step) % step;
  g.strokeStyle = 'rgba(237,241,245,0.028)'; g.lineWidth = 1;
  g.beginPath();
  for (let x = ox; x < W; x += step) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (let y = oy; y < H; y += step) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();
  const bloom = o.bloom ?? 1;
  if (bloom > 0) {
    const R = Math.max(W, H) * 0.75, gr = g.createRadialGradient(W * 1.02, -H * 0.04, 0, W * 1.02, -H * 0.04, R);
    gr.addColorStop(0, `rgba(226,86,78,${0.2 * bloom})`); gr.addColorStop(0.45, `rgba(226,86,78,${0.05 * bloom})`); gr.addColorStop(1, 'rgba(226,86,78,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
}
// The shuriken: four curved blades, a hole in the middle.
function shuriken(g, x, y, r, rot, color = P.acc, hole = P.bg) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = (i * Math.PI) / 2, b = a + Math.PI / 4, c = a - Math.PI / 4;
    const tip = [Math.cos(a) * r, Math.sin(a) * r];
    if (i === 0) g.moveTo(Math.cos(c) * r * 0.3, Math.sin(c) * r * 0.3);
    g.quadraticCurveTo(Math.cos(a - 0.35) * r * 0.55, Math.sin(a - 0.35) * r * 0.55, tip[0], tip[1]);
    g.quadraticCurveTo(Math.cos(a + 0.12) * r * 0.42, Math.sin(a + 0.12) * r * 0.42, Math.cos(b) * r * 0.3, Math.sin(b) * r * 0.3);
  }
  g.closePath(); g.fillStyle = color; g.fill();
  g.beginPath(); g.arc(0, 0, r * 0.12, 0, Math.PI * 2); g.fillStyle = hole; g.fill();
  g.restore();
}
// The katana cut: a thin vermilion blade stroke from p0 to p1 of the line (a→b).
function slash(S, ax, ay, bx, by, p0, p1, w = 7) {
  if (p1 <= p0) return;
  const { g, u } = S;
  const x0 = lerp(ax, bx, p0), y0 = lerp(ay, by, p0), x1 = lerp(ax, bx, p1), y1 = lerp(ay, by, p1);
  const nx = -(by - ay), ny = bx - ax, nl = Math.hypot(nx, ny), hw = (w * u) / 2;

  g.moveTo(x0, y0); g.lineTo(x1 + (nx / nl) * hw, y1 + (ny / nl) * hw); g.lineTo(x1 - (nx / nl) * hw, y1 - (ny / nl) * hw);
  g.closePath(); g.fillStyle = P.acc; g.fill();
}
// Paint `draw` split along a line through (px, py) at angle a. offset(side) → [dx, dy, rot] for each half.
function split(S, px, py, a, draw, offset) {
  const { g, W, H } = S, L = (W + H) * 3, dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx;
  for (const side of [-1, 1]) {
    const [ox, oy, rot] = offset(side);
    g.save();
    g.translate(ox, oy); g.translate(px, py); g.rotate(rot || 0); g.translate(-px, -py);
    g.beginPath();
    g.moveTo(px - dx * L, py - dy * L); g.lineTo(px + dx * L, py + dy * L);
    g.lineTo(px + dx * L + side * nx * L, py + dy * L + side * ny * L); g.lineTo(px - dx * L + side * nx * L, py - dy * L + side * ny * L);
    g.closePath(); g.clip();
    draw(); g.restore();
  }
}
// Map an image rectangle (center vx,vy, width vw in image px) onto a destination rect.
function view(S, im, dx, dy, dw, dh, vx, vy, vw) {
  if (!im) return;
  const k = dw / vw, vh = dh / k;
  const sx = vx - vw / 2, sy = vy - vh / 2;
  S.g.drawImage(im, dx - sx * k, dy - sy * k, im.width * k, im.height * k);
}
// A device: browser (chrome > 0) morphing into a phone (pad > 0). content(x, y, w, h) paints the screen.
function device(S, cx, cy, w, h, r, chrome, pad, content, o = {}) {
  const { g, u } = S, x = cx - w / 2, y = cy - h / 2;
  g.save();
  g.fillStyle = pad > 1 ? '#05070a' : P.s2; S.rrect(x, y, w, h, r); g.fill();
  g.strokeStyle = P.rule2; g.lineWidth = 2 * u; g.stroke();
  const ca = clamp(chrome / (44 * u));
  if (ca > 0.02) {
    g.globalAlpha = ca;
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(x + (24 + i * 20) * u, y + chrome / 2, 6 * u, 0, Math.PI * 2); g.fillStyle = P.s4; g.fill(); }
    mono(S, o.url || 'shinobimedia.ca', x + 100 * u, y + chrome / 2 + 8 * u, 20, P.dim, { tracking: 0.02 });
    g.globalAlpha = 1;
  }
  const sx = x + pad, sy = y + chrome + pad, sw = w - pad * 2, sh = h - chrome - pad * 2;
  g.save(); S.rrect(sx, sy, sw, sh, chrome > 2 ? 0 : Math.max(0, r - pad)); g.clip();
  g.fillStyle = P.bg; g.fillRect(sx, sy, sw, sh);
  content(sx, sy, sw, sh);
  g.restore();
  if (pad > 4) {                                   // the phone's dynamic island
    const iw = sw * 0.26 * clamp((pad - 4) / 8), ih = 22 * u * clamp((pad - 4) / 8);
    g.fillStyle = '#05070a'; S.rrect(cx - iw / 2, sy + 14 * u, iw, ih, ih / 2); g.fill();
  }
  g.restore();
}
// A card with browser chrome baked in, cached per image (pure: depends only on the image and fonts).
const cards = {};
function card(S, key, url) {
  if (cards[key]) return cards[key];
  const im = S.img(key); if (!im) return null;
  const cw = 1200, ih = Math.round((cw * im.height) / im.width), ch = 44;
  const c = document.createElement('canvas'); c.width = cw; c.height = ih + ch;
  const g = c.getContext('2d');
  g.fillStyle = P.s3; g.fillRect(0, 0, cw, ch);
  for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(24 + i * 20, ch / 2, 6, 0, Math.PI * 2); g.fillStyle = P.s4; g.fill(); }
  g.font = `500 19px ${F.m}`; g.fillStyle = P.dim; g.fillText(url, 96, ch / 2 + 7);
  g.drawImage(im, 0, ch, cw, ih);
  g.strokeStyle = 'rgba(237,241,245,0.16)'; g.lineWidth = 2; g.strokeRect(1, 1, cw - 2, ih + ch - 2);

}
// Perspective without a 3D engine: the image drawn in vertical strips, each scaled by its depth.
function persp(S, im, X, Y, Z, rot, w, h, f, ox, oy, shade = 0) {
  const { g } = S, N = 72;
  for (let i = 0; i < N; i++) {
    const s0 = -0.5 + i / N, s1 = s0 + 1 / N;
    const za = Z + Math.sin(rot) * s0 * w, zb = Z + Math.sin(rot) * s1 * w;
    if (f + za < f * 0.25 || f + zb < f * 0.25) continue;
    const ka = f / (f + za), kb = f / (f + zb), k = (ka + kb) / 2;
    const xa = ox + (X + Math.cos(rot) * s0 * w) * ka, xb = ox + (X + Math.cos(rot) * s1 * w) * kb;
    if (xb <= xa) continue;
    const dh = h * k, dy = oy + Y * k - dh / 2;
    g.drawImage(im, (i / N) * im.width, 0, im.width / N, im.height, xa, dy, xb - xa + 0.75, dh);
    const sh = shade + clamp((za + zb) / 2 / 3000) * 0.55;
    if (sh > 0.01) { g.fillStyle = `rgba(10,13,16,${clamp(sh)})`; g.fillRect(xa, dy, xb - xa + 0.75, dh); }
  }
}
const fmt$ = (n) => '$' + Math.round(n).toLocaleString('en-US');
const pushV = (t, t0, H, k = [170, 26]) => -H * spring(t - t0, k);         // outgoing vertical push
const enterV = (t, t0, H, k = [170, 26]) => H * (1 - spring(t - t0, k));   // incoming from below

// ── 1 · hook: "Most websites just sit there." — cut in half at 1.5 s ─────────────
const CUT = B(3);
function hook(t, S) {
  const { g, W, H, u } = S;
  const exitAll = spring(t - B(19.5), [170, 26]);
  g.translate(0, -H * exitAll);
  ground(S, { gy: -t * 12 * u });
  const X = S.pick({ portrait: W * 0.08, square: W * 0.08, landscape: W * 0.1 });
  const maxW = S.pick({ portrait: W * 0.84, square: W * 0.84, landscape: W * 0.7 });
  const size = Math.min(fit(S, 'just sit there.', 700, F.d, maxW, 200, -0.03), fit(S, 'Most websites', 700, F.d, maxW, 200, -0.03));
  const lh = size * u * 1.02;
  const cy = S.pick({ portrait: H * 0.47, square: H * 0.5, landscape: H * 0.5 });
  const push = 1 + 0.035 * range(t, 0, 10);
  g.save(); g.translate(W / 2, cy); g.scale(push, push); g.translate(-W / 2, -cy);
  const O = { size, weight: 700, face: F.d, tracking: -0.03 };

  // phase A: the claim, then the cut
  const exitA = spring(t - B(6), [170, 26]);
  if (exitA < 0.999) {
    const yA = cy - H * 0.9 * exitA;
    const y1 = yA - lh * 0.35, y2 = yA + lh * 0.72;
    const w2 = measure(S, 'just sit there.', size, 700, F.d, -0.03);
    const paint = () => {
      rise(S, t, 0, 'Most websites', X, y1, { ...O, color: P.ink });
      riseRuns(S, t, B(1), [['just ', P.dim], ['sit there.', P.ink]], X, y2, O);
    };
    const a = -0.16, px = X + w2 * 0.62, py = y2 - size * u * 0.33;
    if (t < CUT + 0.07) paint();
    else split(S, px, py, a, paint, (side) => {
      const dt = t - CUT - 0.07;
      if (side < 0) return [0, -10 * u * spring(dt, SPRING.snappy), 0];
      const fall = dt > 0.12 ? (dt - 0.12) ** 2 * 3800 * u : 0;
      return [Math.cos(a) * 70 * u * spring(dt, [200, 24]), 14 * u * spring(dt, [200, 24]) + fall, 0.18 * clamp((dt - 0.1) * 1.5)];
    });
    // the blade: head crosses in 0.1 s, the tail follows
    const ax = -W * 0.1, ay = py + (ax - px) * Math.tan(a), bx = W * 1.1, by = py + (bx - px) * Math.tan(a);
    slash(S, ax, ay, bx, by, range(t, CUT + 0.12, CUT + 0.34), range(t, CUT, CUT + 0.1), 9);
  }

  // phase B: the answer (the site's own headline), then it shrinks up to make room
  const shrink = spring(t - B(12), [150, 24]);
  const yB = cy - lh * 0.6 + enterV(t, B(5.6), H * 0.4) * 0;
  const sc = lerp(1, S.pick({ portrait: 0.9, square: 0.62, landscape: 0.66 }), shrink);
  const ty = -shrink * S.pick({ portrait: H * 0.1, square: H * 0.2, landscape: H * 0.2 });
  g.save(); g.translate(X, yB + ty); g.scale(sc, sc); g.translate(-X, -yB);
  rise(S, t, B(6.25), 'Yours should', X, yB - lh * 0.1, { ...O, color: P.ink });
  rise(S, t, B(7.5), 'bring in', X, yB + lh * 0.95, { ...O, color: P.accT });
  const wc = rise(S, t, B(8.5), 'customers.', X, yB + lh * 2.0, { ...O, color: P.accT });
  if (t > B(9.5)) { g.fillStyle = P.acc; g.fillRect(X, yB + lh * 2.0 + size * u * 0.16, wc * spring(t - B(9.5), SPRING.snappy), 10 * u); }
  g.restore();
  g.restore();

  // phase C: the site's own pill and sub-headline
  const pillY = S.pick({ portrait: H * 0.62, square: H * 0.73, landscape: H * 0.72 });
  const pillTxt = S.orientation === 'portrait' ? ['shinobimedia.ca', ' · ', '', '', 'Accepting new projects'] : ['shinobimedia.ca', ' · ', 'Ottawa & Canada-wide', ' · ', 'Accepting new projects'];
  const pSize = Math.max(20, Math.min(32, fit(S, pillTxt.join(''), 500, F.m, maxW - 110 * u, 32, 0.04)));
  const pw = measure(S, pillTxt.join(''), pSize, 500, F.m, 0.04) + 90 * u, ph = pSize * u * 2.4;
  const ps = spring(t - B(13), SPRING.snappy);
  if (ps > 0.01) {
    g.save(); g.beginPath(); g.rect(X - 10 * u, pillY - ph / 2 - 4 * u, pw * ps + 20 * u, ph + 8 * u); g.clip();
    g.fillStyle = P.s1; S.rrect(X, pillY - ph / 2, pw, ph, ph / 2); g.fill();
    g.strokeStyle = P.rule2; g.lineWidth = 2 * u; g.stroke();
    g.beginPath(); g.arc(X + 34 * u, pillY, 7 * u, 0, Math.PI * 2); g.fillStyle = P.acc; g.fill();
    let px = X + 58 * u;
    pillTxt.forEach((s, i) => { px += S.text(s, px, pillY + pSize * u * 0.36, { size: pSize, face: F.m, weight: 500, tracking: 0.04, color: i === 4 ? P.accT : i % 2 ? P.muted : P.ink, alpha: swapAlpha(t, B(13.2)) }); });
    g.restore();

  const subSize = S.pick({ portrait: 58, square: 40, landscape: 44 });
  const subY = pillY + ph / 2 + subSize * u * 2.2;
  rise(S, t, B(14.5), 'You run your business.', X, subY, { size: subSize, weight: 500, face: F.u, color: P.ink });
  rise(S, t, B(15.5), 'We bring the customers.', X, subY + subSize * u * 1.35, { size: subSize, weight: 500, face: F.u, color: P.dim });
}

// ── 2 · the usual way: five lines, each pinned by a shuriken ───────────────────
const OLD = ['Price on request.', 'Tax added at the invoice.', 'An account manager in between.', 'A contract you can’t leave.', 'Your site, rented back to you.'];
const oldIn = (i) => B(21 + i * 4), oldHit = (i) => B(22.75 + i * 4);
const OLD_CUT = B(43.5);
function oldWayLayout(S) {
  const { W, H, u } = S;
  const X = S.pick({ portrait: W * 0.08, square: W * 0.08, landscape: W * 0.12 });
  const maxW = S.pick({ portrait: W * 0.76, square: W * 0.74, landscape: W * 0.62 });
  const size = S.pick({ portrait: 96, square: 60, landscape: 76 });
  const lh = size * u * 1.1, gap = S.pick({ portrait: 56, square: 26, landscape: 30 }) * u;
  const items = OLD.map((s) => wrap(S, s, size, 600, F.d, maxW, -0.02));
  const total = items.reduce((a, l) => a + l.length * lh, 0) + gap * (items.length - 1);
  let y = 0;
  const pos = items.map((l) => { const p = y; y += l.length * lh + gap; return p; });
  // the camera keeps what is on screen centered: one key per new line
  const mid = S.pick({ portrait: H * 0.5, square: H * 0.54, landscape: H * 0.54 });
  const keys = items.map((l, i) => [oldIn(i) - 0.1, mid - (pos[i] + l.length * lh - lh * 1.9) / 2]);
  return { X, size, lh, items, pos, keys, total };
}
function oldWay(t, S) {
  const { g, W, H, u } = S;
  const L = oldWayLayout(S);
  const paint = () => {
    g.save();
    g.translate(0, enterV(t, B(19.5), H));
    ground(S, { gy: -t * 12 * u, bloom: 0.5 });
    const drift = noise(t * 0.4, 2) * 4 * u;
    g.translate(drift, track(t, [[0, L.keys[0][1]], ...L.keys], ...CAM));
    const hy = L.pos[0] - L.lh * 1.3;
    g.fillStyle = P.acc; g.fillRect(L.X, hy - 10 * u, 36 * u * spring(t - B(20), SPRING.snappy), 4 * u);
    rise(S, t, B(20), 'THE USUAL WAY', L.X + 52 * u, hy, { size: S.pick({ portrait: 30, square: 24, landscape: 26 }), face: F.m, weight: 500, color: P.muted, tracking: 0.16 });
    L.items.forEach((lines, i) => {
      const hit = oldHit(i), dim = spring(t - hit, SPRING.default);
      const color = mixColor(P.ink, P.faint, dim * 0.85);
      let endX = 0, endY = 0;
      lines.forEach((ln, j) => {
        const y = L.pos[i] + j * L.lh;
        const w = rise(S, t, oldIn(i) + j * B(0.5), ln, L.X, y, { size: L.size, weight: 600, face: F.d, color, tracking: -0.02 });
        if (t > hit) {                                  // the strike: left to right, line by line

// ── 3 · enter the shinobi: the disc, the mascot, the wordmark ─────────────────
const FACTS = ['No account managers.', 'No office overhead.', 'The person you brief builds it.'];
function enter(t, S) {
  const { g, W, H, u } = S;
  ground(S, { bloom: 0 });
  const port = S.orientation === 'portrait', land = S.orientation === 'landscape';
  const settle = spring(t - B(56), CAM);
  const off = lerp(S.pick({ portrait: H * 0.1, square: H * 0.12, landscape: H * 0.1 }), 0, settle);
  const R = S.pick({ portrait: 250, square: 170, landscape: 250 }) * u;
  const dcx = S.pick({ portrait: W / 2, square: W * 0.3, landscape: W * 0.28 });
  const dcy = S.pick({ portrait: H * 0.25, square: H * 0.4, landscape: H * 0.47 }) + (land || S.orientation === 'square' ? 0 : off);
  const drift = noise(t * 0.5, 7) * 3 * u;
  const pull = 1 + 0.03 * range(t, B(44), B(64));
  g.save(); g.translate(W / 2, H / 2); g.scale(pull, pull); g.translate(-W / 2 + drift, -H / 2);

  const ds = spring(t - B(44), SPRING.heavy);
  // one shock ring on the impact
  const ring = range(t, B(44), B(44) + 0.9);
  if (ring > 0 && ring < 1) { g.strokeStyle = P.acc; g.globalAlpha = 1 - ring; g.lineWidth = 3 * u; g.beginPath(); g.arc(dcx, dcy, R * (1 + ring * 1.6), 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1; }
  g.fillStyle = P.acc; g.beginPath(); g.arc(dcx, dcy, R * ds, 0, Math.PI * 2); g.fill();

  // mascot rises out of the disc
  const im = S.img('mascot');
  if (im && t > B(45)) {
    const mw = R * 1.62, mh = (mw * im.height) / im.width;
    const baseY = dcy + R * 0.66;
    const m = spring(t - B(45), SPRING.playful);
    g.save();
    g.beginPath(); g.arc(dcx, dcy, R * ds, 0, Math.PI * 2); g.rect(dcx - W, -H, W * 2, dcy + H); g.clip();
    g.drawImage(im, dcx - mw * 0.52, baseY - mh + (1 - m) * mh * 1.1, mw, mh);
    g.restore();
  }

  // wordmark + tagline
  const wmMaxW = S.pick({ portrait: W * 0.84, square: W * 0.46, landscape: W * 0.44 });
  const wmSize = fit(S, 'shinobimedia.ca', 700, F.d, wmMaxW, 140, -0.03);
  const wx = S.pick({ portrait: W / 2, square: W * 0.46, landscape: W * 0.5 });
  const wy = S.pick({ portrait: H * 0.47, square: H * 0.34, landscape: H * 0.37 }) + (port ? off : off * 0.9);
  const align = port ? 'center' : 'left';
  const OW = { size: wmSize, weight: 700, face: F.d, tracking: -0.03, align };
  riseChars(S, t, B(48), [['shinobimedia', P.ink], ['.ca', P.accT]], wx, wy, OW, B(0.25));
  const tgSize = S.pick({ portrait: 50, square: 32, landscape: 40 });
  const tg = port ? ['Websites, social media and local SEO', 'for Ottawa businesses.'] : ['Websites, social media and local SEO', 'for Ottawa businesses.'];
  rise(S, t, B(52), tg[0], wx, wy + tgSize * u * 2.0, { size: tgSize, weight: 500, face: F.u, color: P.ink, align });
  rise(S, t, B(53), tg[1], wx, wy + tgSize * u * 3.35, { size: tgSize, weight: 500, face: F.u, color: P.dim, align });

  // three facts as ruled rows
  const fx = S.pick({ portrait: W * 0.1, square: W * 0.46, landscape: W * 0.5 });
  const fw = S.pick({ portrait: W * 0.8, square: W * 0.48, landscape: W * 0.4 });
  const fy0 = S.pick({ portrait: H * 0.66, square: H * 0.6, landscape: H * 0.62 });
  const rowH = S.pick({ portrait: 112, square: 70, landscape: 90 }) * u;
  const fSize = S.pick({ portrait: 52, square: 30, landscape: 38 });
  FACTS.forEach((f, i) => {
    const t0 = B(56 + i * 2), y = fy0 + i * rowH;
    g.fillStyle = P.rule2; g.fillRect(fx, y, fw * spring(t - t0, SPRING.default), 2 * u);
    rise(S, t, t0 + 0.08, '0' + (i + 1), fx, y + rowH * 0.62, { size: fSize * 0.62, face: F.m, weight: 500, color: P.accT });
    rise(S, t, t0 + 0.12, f, fx + fSize * u * 1.6, y + rowH * 0.62, { size: fSize, weight: 500, face: F.u, color: P.ink });
  });
  g.restore();

  // exit: vermilion floods out of the disc
  if (t > B(64)) {
    const Rb = Math.hypot(W, H) * 1.05, fl = spring(t - B(64), [120, 22]);
    g.fillStyle = P.acc; g.beginPath(); g.arc(dcx, dcy, Rb * fl, 0, Math.PI * 2); g.fill();
  }
}

    g.beginPath(); g.moveTo(ix, iy + 8 * u); g.lineTo(ix, iy - 12 * u); g.moveTo(ix - 8 * u, iy - 4 * u); g.lineTo(ix, iy - 12 * u); g.lineTo(ix + 8 * u, iy - 4 * u);
    g.moveTo(ix - 14 * u, iy + 6 * u); g.lineTo(ix - 14 * u, iy + 14 * u); g.lineTo(ix + 14 * u, iy + 14 * u); g.lineTo(ix + 14 * u, iy + 6 * u); g.stroke();
    S.text(label, bx + 80 * u, bY + bSize * u * 0.36, { size: bSize, weight: 600, face: F.u, color: col });
    g.restore();
    // cursor
    const cur = trackN(t, [[0, [bx + bw + 300 * u, bY + 260 * u]], [B(208.5), [bx + bw * 0.62, bY + 10 * u]]], 150, 24);
    if (t > B(208)) {
      g.save(); g.translate(cur[0], cur[1]); g.scale((1.4 - 0.15 * press) * u, (1.4 - 0.15 * press) * u);
      g.beginPath(); [[0, 0], [0, 34], [9, 26], [15, 40], [21, 37], [15, 24], [26, 24]].forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
      g.closePath(); g.fillStyle = P.ink; g.fill(); g.strokeStyle = P.bg; g.lineWidth = 2.5; g.stroke(); g.restore();
    }
  }
}

// ── 9 · a client, in their words (the site's testimonial, names withheld) ──────
const VOICE = 'They beat the quote we got from a bigger agency by a real margin, and delivered ahead of schedule. Direct, friendly, no runaround.';
function voices(t, S) {
  const { g, W, H, u } = S;
  g.translate(0, enterV(t, B(213.5), H) - H * spring(t - B(226.5), [170, 26]));
  ground(S, { bloom: 0.35 });
  const X = S.pick({ portrait: W * 0.1, square: W * 0.1, landscape: W * 0.14 });
  const maxW = S.pick({ portrait: W * 0.8, square: W * 0.8, landscape: W * 0.7 });
  const size = S.pick({ portrait: 76, square: 50, landscape: 62 });
  const lh = size * u * 1.22;
  const lines = wrap(S, VOICE, size, 500, F.d, maxW, -0.01);
  const blockH = lines.length * lh;
  const y0 = S.pick({ portrait: H * 0.48, square: H * 0.5, landscape: H * 0.5 }) - blockH / 2 + lh * 0.7;
  const push = 1 + 0.03 * range(t, B(216), B(228));
  g.save(); g.translate(W / 2, H / 2); g.scale(push, push); g.translate(-W / 2, -H / 2);
  rise(S, t, B(214.4), '“', X - 12 * u, y0 - lh * 0.6, { size: 200, weight: 700, face: F.d, color: P.acc });
  const bar = spring(t - B(214.8), SPRING.default);
  g.fillStyle = P.acc; g.fillRect(X - 44 * u, y0 - lh * 0.8, 5 * u, (blockH + lh * 0.3) * bar);
  let wi = 0;
  lines.forEach((ln, j) => {
    let x = X; const y = y0 + j * lh;
    for (const w of ln.split(' ')) {
      const tl = B(215.4) + wi * B(0.3);
      const lit = spring(t - tl, SPRING.default);
      const ww = rise(S, t, B(214.8) + j * 0.05, w + ' ', x, y, { size, weight: 500, face: F.d, color: mixColor(P.faint, P.ink, lit), tracking: -0.01 });
      x += ww || measure(S, w + ' ', size, 500, F.d, -0.01);
      wi++;
    }
  });
  const ay = y0 + blockH + 40 * u;
  rise(S, t, B(223), 'Bilingual consultancy', X, ay, { size: 34, weight: 600, face: F.u, color: P.ink });
  rise(S, t, B(223.5), 'CLIENT · CENTRETOWN · NOV 2025', X, ay + 48 * u, { size: 20, face: F.m, weight: 500, color: P.muted, tracking: 0.14 });
  g.restore();
}

// ── 10 · the five promises ─────────────────────────────────────────────────────
const PROMISES = [
  ['At least 20% under any written quote.', 'We match the scope line for line, in writing.'],
  ['Don’t like the first design? You don’t pay.', 'And every price is the final price.'],
  ['You own everything, outright.', 'The code, the domain and every account are in your name.'],
  ['Hosting included, month to month.', 'Website Care from launch. No contract, no notice period.'],
  ['You talk to the person who builds it.', 'No account manager. No offshore build team.'],
];
const promT = (i) => B(230 + i * 4);
function promises(t, S) {
  const { g, W, H, u } = S;
  const port = S.orientation === 'portrait';
  g.translate(0, enterV(t, B(226.5), H) - H * spring(t - B(250), [170, 26]));
  ground(S, { gy: -t * 14 * u, bloom: 0.6 });
  const X = S.pick({ portrait: W * 0.1, square: W * 0.1, landscape: W * 0.1 });
  const maxW = S.pick({ portrait: W * 0.74, square: W * 0.74, landscape: W * 0.72 });
  const size = S.pick({ portrait: 64, square: 42, landscape: 54 });
  const lh = size * u * 1.1;
  const layout = PROMISES.map(([p]) => wrap(S, p, size, 700, F.d, maxW, -0.02));
  const pitch = S.pick({ portrait: H * 0.138, square: H * 0.15, landscape: H * 0.145 });
  const y0 = S.pick({ portrait: H * 0.25, square: H * 0.26, landscape: H * 0.27 });
  const hy = y0 - S.pick({ portrait: 150, square: 120, landscape: 130 }) * u;
  rise(S, t, B(228), 'OUR FIVE PROMISES', X, hy, { size: S.pick({ portrait: 30, square: 24, landscape: 26 }), face: F.m, weight: 500, color: P.accT, tracking: 0.16 });
  rise(S, t, B(228.6), 'In the written scope before any work starts.', X, hy + 50 * u, { size: S.pick({ portrait: 32, square: 26, landscape: 30 }), weight: 500, face: F.u, color: P.dim });
  const nx = X + S.pick({ portrait: 96, square: 80, landscape: 90 }) * u;
  PROMISES.forEach(([, sub], i) => {
    const t0 = promT(i), y = y0 + i * pitch;
    const current = t < promT(i + 1) || i === 4;
    const dim = i === 4 ? 0 : spring(t - promT(i + 1), SPRING.default);
    const col = mixColor(P.ink, P.faint, dim * 0.8);
    rise(S, t, t0, '0' + (i + 1), X, y, { size: size * 0.8, weight: 700, face: F.d, color: mixColor(P.accT, P.faint, dim * 0.8) });
    layout[i].forEach((ln, j) => rise(S, t, t0 + j * 0.06, ln, nx, y + j * lh, { size, weight: 700, face: F.d, color: col, tracking: -0.02 }));
    const sy = y + layout[i].length * lh + 4 * u;
    if (current) rise(S, t, t0 + B(0.8), sub, nx, sy, { size: S.pick({ portrait: 34, square: 22, landscape: 26 }), weight: 500, face: F.u, color: P.dim }, i === 4 ? Infinity : promT(i + 1) - 0.12);
  });
  const stops = PROMISES.map((_, i) => [promT(i), y0 + i * pitch - size * u * 0.85]);
  const bar = indicator(t, stops, lh * 1.0 + (port ? lh : 0));
  const barIn = spring(t - promT(0), SPRING.snappy);
  g.fillStyle = P.acc; S.rrect(X - 40 * u, bar.left, 8 * u, (bar.right - bar.left) * barIn, 4 * u); g.fill();
}

// ── 11 · where, then the lockup on the final hit ───────────────────────────────
const AREAS = ['Ottawa', 'Kanata', 'Nepean', 'Barrhaven', 'Orléans', 'Stittsville', 'Gloucester', 'Gatineau'];
const HIT = B(260);
function finale(t, S) {
  const { g, W, H, u } = S;
  const port = S.orientation === 'portrait', land = S.orientation === 'landscape';
  g.translate(0, enterV(t, B(250), H));
  ground(S, { bloom: 0.5 + 0.5 * spring(t - HIT, SPRING.heavy) });

  // neighbourhoods on eighth notes, stacking into a line
  const aOut = B(258.6);
  const aSize = fit(S, 'Stittsville', 700, F.d, W * 0.84, S.pick({ portrait: 190, square: 170, landscape: 200 }), -0.03);
  const aY = S.pick({ portrait: H * 0.47, square: H * 0.5, landscape: H * 0.52 });
  AREAS.forEach((a, i) => {
    const t0 = B(252 + i * 0.5), tOut = i < AREAS.length - 1 ? B(252 + (i + 1) * 0.5) - 0.02 : aOut;
    rise(S, t, t0, a, W / 2, aY, { size: aSize, weight: 700, face: F.d, color: i === 0 ? P.accT : P.ink, tracking: -0.03, align: 'center' }, tOut);
  });
  rise(S, t, B(252), 'WHERE WE WORK IN PERSON', W / 2, aY - aSize * u * 1.05, { size: 24, face: F.m, weight: 500, color: P.muted, tracking: 0.16, align: 'center' }, aOut);
  rise(S, t, B(256), 'and remotely, across Canada.', W / 2, aY + 90 * u, { size: S.pick({ portrait: 42, square: 36, landscape: 40 }), weight: 500, face: F.u, color: P.dim, align: 'center' }, aOut);
  rise(S, t, B(256.5), 'ENGLISH · FRANÇAIS', W / 2, aY + 150 * u, { size: 22, face: F.m, weight: 500, color: P.muted, tracking: 0.16, align: 'center' }, aOut);

  // the shuriken lands on the final hit
  const cx = W / 2 + noise(t * 0.4, 5) * 3 * u;
  const cyL = S.pick({ portrait: H * 0.5, square: H * 0.5, landscape: H * 0.5 });
  if (t > B(258.5)) {
    const fl = clamp(spring(t - B(258.5), [90, 14.5]) / 0.98);
    const land2 = spring(t - HIT, SPRING.heavy);
    const x = lerp(W * 1.15, cx, fl), y = lerp(-H * 0.15, cyL, fl);
    const r = lerp(40, lerp(40, S.pick({ portrait: 520, square: 420, landscape: 470 }), land2), 1) * u;
    const spin = -fl * 30 + (t - HIT > 0 ? -(t - HIT) * 0.12 : 0);
    g.save(); g.globalAlpha = lerp(1, 0.07, land2);
    shuriken(g, x, y, r, spin, P.acc, P.bg);
    g.restore();
    const ring = range(t, HIT, HIT + 0.9);
    if (ring > 0 && ring < 1) { g.strokeStyle = P.acc; g.globalAlpha = 1 - ring; g.lineWidth = 3 * u; g.beginPath(); g.arc(cx, cyL, 60 * u + ring * Math.hypot(W, H) * 0.45, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1; }
  }

  // lockup
  const im = S.img('mascot');
  const mw = S.pick({ portrait: 400, square: 250, landscape: 300 }) * u, mh = im ? (mw * im.height) / im.width : 0;
  const wmSize = fit(S, 'shinobimedia.ca', 700, F.d, S.pick({ portrait: W * 0.84, square: W * 0.72, landscape: W * 0.56 }), 170, -0.03);
  const tgS = S.pick({ portrait: 40, square: 32, landscape: 36 });
  const gap = 34 * u;
  const groupH = mh + gap + wmSize * u + gap * 0.8 + tgS * u * 1.2 + gap * 1.6 + 96 * u + gap + 30 * u;
  let y = cyL - groupH / 2;
  if (im && t > HIT) {
    const m = spring(t - HIT - 0.1, SPRING.playful);
    g.save(); g.beginPath(); g.rect(0, -H, W, y + mh + H); g.clip();
    g.drawImage(im, cx - mw * 0.52, y + (1 - m) * mh * 1.15, mw, mh);
    g.restore();
  }
  y += mh + gap + wmSize * u * 0.8;
  riseChars(S, t, HIT + 0.25, [['shinobimedia', P.ink], ['.ca', P.accT]], cx, y, { size: wmSize, weight: 700, face: F.d, tracking: -0.03, align: 'center' }, B(0.2));
  y += gap * 0.8 + tgS * u * 1.2;
  rise(S, t, B(262.5), 'Ottawa web design that brings in customers.', cx, y, { size: tgS, weight: 500, face: F.u, color: P.dim, align: 'center' });
  y += gap * 1.6 + 48 * u;
  const bs = spring(t - B(264), SPRING.snappy);
  if (bs > 0.01) {
    const bSize = S.pick({ portrait: 38, square: 32, landscape: 34 });
    const label = 'Get a free quote';
    const bw = measure(S, label, bSize, 600, F.u) + 150 * u, bh = bSize * u * 2.5;
    g.save(); g.translate(cx, y); g.scale(bs, bs);
    g.fillStyle = P.acc; S.rrect(-bw / 2, -bh / 2, bw, bh, bh / 2); g.fill();
    S.text(label, -bw / 2 + 50 * u, bSize * u * 0.36, { size: bSize, weight: 600, face: F.u, color: P.accInk, alpha: swapAlpha(t, B(264)) });
    g.strokeStyle = P.accInk; g.lineWidth = 3.2 * u; g.lineCap = 'round'; g.lineJoin = 'round';
    const ax = bw / 2 - 58 * u, ay = 0;
    g.globalAlpha = swapAlpha(t, B(264));
    g.beginPath(); g.moveTo(ax - 12 * u, ay); g.lineTo(ax + 10 * u, ay); g.moveTo(ax + 2 * u, ay - 8 * u); g.lineTo(ax + 10 * u, ay); g.lineTo(ax + 2 * u, ay + 8 * u); g.stroke();
    g.restore();
  }
  y += 48 * u + gap + 30 * u;
  rise(S, t, B(265), '(613) 800-8028  ·  info@shinobimedia.ca', cx, y, { size: S.pick({ portrait: 26, square: 22, landscape: 24 }), face: F.m, weight: 500, color: P.ink, tracking: 0.06, align: 'center' });
}
