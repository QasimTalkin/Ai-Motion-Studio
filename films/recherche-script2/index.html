<!doctype html>
<meta charset="utf-8">
<title>Les théories sociologiques des professions</title>
<link rel="stylesheet" href="/lib/fonts.css">
<style>html,body{margin:0;background:#0F172A}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Script 2 (2 min 24). French VO (Google TTS), English subtitles. Every cue reads audio/timing.json.
// One object carries the film: the lock on a profession's door. Its pins are the criteria for getting in.
// A  doors → wall of regulated professions   P  lens → lock → a candidate's key jams   S  "3 approches"
// F  fonctionnaliste (match cut)   I  interactionniste (pan)   C  conflictualiste (push)
// R  three lenses on the same lock   K  competence is not enough   E  references
import { boot } from '/lib/stage.js';
import { L, T, DUR } from './js/timing.js';
import { P, CAM, sp, range, dotGrid, vignette, subtitles, BPM } from './js/kit.js';
import { chapterA, chapterP, chapterS, ROLL } from './js/primer.js';
import { approachF, approachI, approachC } from './js/approaches.js';
import { recap, conclusion, ending } from './js/finale.js';

const SUBS = Object.values(L).flatMap((l) => l.subs);

function film(t, S) {
  const { g, W, H, u } = S;
  const cX = W * sp(t - T.TI, CAM), cY = H * sp(t - T.TC, CAM);
  const lift = sp(t - T.P_IN, [60, 16]) * (1 - sp(t - T.Q_TO_S, [60, 16]));
  if (lift > 0.001) { g.fillStyle = P.bg2; g.globalAlpha = lift; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  dotGrid(S, cX, cY + t * 9 * u);

  if (t < T.Q_TO_S + 0.2) chapterA(t, S);
  if (t >= T.P_LOCK && t < T.Q_TO_S + 0.6) chapterP(t, S);
  if (t >= T.Q_TO_S - 0.05 && t < T.TF + 0.9) chapterS(t, S);
  if (t >= T.TF && t < T.TI + 1.1) { g.save(); g.translate(-Math.min(cX, W), 0); approachF(t, S); g.restore(); }
  if (t >= T.TI && t < T.TC + 1.1) { g.save(); g.translate(W - cX, -cY); approachI(t, S); g.restore(); }
  if (t >= T.TC && t < T.TR + 1.0) {
    const ex = sp(t - T.TR, [150, 22]);
    g.save(); g.globalAlpha = 1 - range(ex, 0, 0.5); g.translate(0, H - cY - ex * 0.3 * H); approachC(t, S); g.restore();
  }
  if (t >= T.TR && t < T.TK + 1.0) recap(t, S);
  if (t >= T.TK && t < T.TE + 1.0) conclusion(t, S);
  if (t >= T.TE) ending(t, S);

  vignette(S);
  subtitles(t, S, SUBS);
  const fade = range(t, T.FADE, DUR);
  if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0, 0, W, H); }
}

// ── sound: SFX on the spoken words; the score ducks under the voice ─────────
const c = (t, type, gain = 0.5) => ({ t, type, gain });
const { a0, a1, p, s, f, fx, i, ix, c: cl, cx, r, k, e } = L;
const typing = (t0, n, cps, gain = 0.2) => Array.from({ length: Math.ceil(n / 2) }, (_, j) => c(t0 + (j * 2) / cps, 'type', gain));
const ticks = (t0, n, dt, gain = 0.4) => Array.from({ length: n }, (_, j) => c(t0 + j * dt, 'tick', gain));
const cues = [
  // primer: doors
  c(0, 'thump', 0.5), c(0.02, 'swipe', 0.3), c(a0.marks.dro - 0.25, 'swipe', 0.4), c(a0.marks.dro, 'pop', 0.45),
  c(a0.marks.ens - 0.25, 'swipe', 0.4), c(a0.marks.ens, 'pop', 0.45),
  c(T.PULL, 'whoosh', 0.6), ...ticks(T.PULL + 0.12, 9, 0.055, 0.35),
  c(a1.marks.reg, 'impact', 0.45), ...Array.from({ length: 10 }, (_, j) => c(a1.marks.reg + 0.03 + j * 0.05, 'click', 0.4)),
  ...typing(a1.marks.reg, 24, 40), ...typing(a1.marks.ca, 9, 30, 0.25),
  // problem
  c(T.P_IN, 'whoosh', 0.55), ...typing(p.marks.a, 25, 34), c(T.P_IN + 0.75, 'swipe', 0.3),
  c(T.P_LOCK, 'whoosh', 0.65), c(T.P_LOCK + 0.12, 'thump', 0.5), ...[0, 1, 2, 3].map((j) => c(T.P_LOCK + 0.5 + j * 0.09, 'pop', 0.35)),
  c(p.marks.c - 0.1, 'swipe', 0.45), ...ticks(T.P_KEY + 0.3, 7, 0.13, 0.45), c(T.P_JAM, 'impact', 0.7), c(T.P_JAM + 0.02, 'click', 0.6), c(p.marks.pres, 'pop', 0.45),
  // solution
  c(T.Q_TO_S, 'whoosh', 0.55), ...ROLL.slice(0, 2).map((x, j) => c(x, 'tick', 0.55 + j * 0.08)), c(s.marks.three - 0.02, 'impact', 0.7),
  ...[0, 1, 2].map((j) => c(s.marks.three + 0.36 + j * 0.15, 'pop', 0.42)), ...typing(s.marks.three + 0.55, 26, 34),
  ...[0, 1, 2].map((j) => c(s.marks.exp + 0.1 + j * 0.22, 'tick', 0.5)), c(s.marks.est, 'swipe', 0.4),
  // 1 · fonctionnaliste
  c(T.TF + 0.02, 'whoosh', 0.7), c(f.marks.name, 'thump', 0.55), ...ticks(f.marks.a + 0.15, 4, 0.1, 0.5), c(f.marks.crit, 'swipe', 0.4),
  ...ticks(f.marks.pre + 0.05, 4, 0.07, 0.35), c(f.marks.grp, 'impact', 0.55), c(f.marks.grp + 0.01, 'thump', 0.45), c(f.marks.etat, 'impact', 0.6), c(f.marks.etat + 0.01, 'thump', 0.45),
  c(fx.marks.a - 0.2, 'whoosh', 0.4), c(fx.marks.par, 'swipe', 0.4), c(fx.marks.b - 0.1, 'whoosh', 0.45),
  ...['soi', 'def', 'ins'].flatMap((m) => [c(fx.marks[m] - 0.02, 'thump', 0.45), c(fx.marks[m] + 0.1, 'pop', 0.35)]), c(fx.marks.ins + 0.2, 'impact', 0.5),
  c(fx.marks.c - 0.1, 'whoosh', 0.45), ...['sav', 'for', 'code', 'perm'].map((m) => c(fx.marks[m], 'pop', 0.45)),
  c(fx.marks.perm + 0.6, 'swipe', 0.45), ...ticks(fx.marks.perm + 0.75, 7, 0.12, 0.45), c(fx.marks.perm + 1.65, 'click', 0.6), c(fx.marks.perm + 1.7, 'chime', 0.25),
  c(fx.marks.d - 0.1, 'whoosh', 0.45), ...ticks(fx.marks.prov, 10, 0.085, 0.45), ...ticks(fx.marks.prov + 1.05, 3, 0.1, 0.4), c(fx.marks.ord, 'swipe', 0.4), c(fx.marks.ord + 0.4, 'chime', 0.2),
  // 2 · interactionniste
  c(T.TI, 'whoosh', 0.75), c(i.marks.name, 'thump', 0.5), ...ticks(i.marks.a - 0.05, 4, 0.08, 0.45),
  ...[0, 0.42, 0.84, 1.26, 1.68].map((dt) => c(i.marks.neg + dt, 'pop', 0.4)), c(i.marks.sat, 'swipe', 0.4), c(i.marks.sat + 1.3, 'chime', 0.22),
  c(ix.marks.a - 0.15, 'swipe', 0.45), ...['cli', 'col', 'pub'].map((m) => c(ix.marks[m], 'pop', 0.45)),
  c(ix.marks.c - 0.1, 'whoosh', 0.45), ...ticks(ix.marks.day - 0.1, 5, 0.34, 0.5), c(ix.marks.d - 0.15, 'whoosh', 0.45),
  ...[0, 1, 2].map((j) => c(ix.marks.gag + 0.3 + j * 0.22, 'tick', 0.5)), ...[0, 1, 2].map((j) => c(ix.marks.conv + 0.1 + j * 0.12, 'pop', 0.4)), c(ix.marks.conv + 0.35, 'chime', 0.25),
  // 3 · conflictualiste
  c(T.TC, 'whoosh', 0.75), c(cl.marks.name, 'thump', 0.5), ...ticks(cl.marks.a - 0.05, 4, 0.08, 0.45),
  ...[0, 1, 2].flatMap((j) => [c(cl.marks.ferm - 0.45 + j * 0.14, 'click', 0.45), c(cl.marks.ferm + 0.05 + j * 0.14, 'thump', 0.4)]),
  c(cl.marks.pres, 'swipe', 0.45), c(cl.marks.pres + 0.05, 'thump', 0.45), ...ticks(cl.marks.ctrl + 0.05, 8, 0.05, 0.4),
  c(cx.marks.a - 0.2, 'whoosh', 0.45), c(cx.marks.lar, 'swipe', 0.4), ...typing(cx.marks.proj - 0.15, 24, 30),
  c(cx.marks.mkt, 'pop', 0.45), c(cx.marks.mkt + 0.35, 'click', 0.5), c(cx.marks.stat, 'pop', 0.45), c(cx.marks.stat + 0.35, 'click', 0.5),
  c(cx.marks.c - 0.3, 'whoosh', 0.4), ...['c', 'exa', 'pla'].map((m) => c(cx.marks[m], 'click', 0.55)), ...ticks(cx.marks.c + 0.2, 10, 0.21, 0.25),
  c(cx.marks.clo - 0.1, 'swipe', 0.45), c(cx.marks.clo + 0.5, 'impact', 0.45), c(cx.marks.web, 'pop', 0.4),
  c(cx.marks.d - 0.1, 'whoosh', 0.45), c(cx.marks.more, 'swipe', 0.4), ...ticks(cx.marks.mono + 0.05, 12, 0.04, 0.35), c(cx.marks.mono + 0.5, 'impact', 0.55),
  // recap
  c(T.TR, 'whoosh', 0.6), ...[0, 1, 2].map((j) => c(T.TR + 0.25 + j * 0.12, 'pop', 0.4)),
  ...['f', 'i', 'c'].map((m) => c(r.marks[m], 'click', 0.45)), c(r.marks.f + 0.6, 'chime', 0.2), c(r.marks.c + 0.6, 'thump', 0.4),
  // conclusion
  c(T.TK, 'whoosh', 0.6), ...typing(k.marks.a - 0.1, 35, 40), ...ticks(k.marks.comp + 0.05, 5, 0.08, 0.5),
  c(k.marks.comp + 0.45, 'swipe', 0.5), ...ticks(k.marks.comp + 0.6, 7, 0.12, 0.45), c(k.marks.comp + 1.6, 'impact', 0.7), c(k.marks.comp + 1.62, 'click', 0.6),
  ...['pres', 'ferm', 'ctrl'].map((m) => c(k.marks[m], 'pop', 0.5)), c(k.marks.ent - 0.1, 'whoosh', 0.55), c(k.marks.top, 'chime', 0.25),
  // ending
  c(T.TE, 'whoosh', 0.55), c(e.marks.a, 'swipe', 0.4), ...typing(e.marks.soc, 26, 36), c(e.marks.b + 0.1, 'pop', 0.45), c(e.marks.b + 0.45, 'pop', 0.45),
];

boot({
  title: 'Les théories sociologiques des professions', dur: DUR, bpm: BPM, formats: ['9:16', '16:9'], palette: P, background: P.bg,
  music: { style: 'minimal', key: 'F', seed: 5, intro: 1, breaks: [9, 58], volume: 0.3 },
  voice: { file: 'audio/voice.wav', volume: 1 },
  sfxVolume: 0.5,
  cues,
  poster: 125.9,
  draw: film,
});
</script>
