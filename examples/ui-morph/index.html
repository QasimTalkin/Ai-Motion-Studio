<!doctype html>
<meta charset="utf-8">
<title>UI Morph Loop</title>
<link rel="stylesheet" href="/lib/fonts.css">
<style>html,body{margin:0;background:#EEEAE2}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// prompts/04-ui-morph-spec.xml, built. One container never cuts: every state is the same element
// changing size, radius and fill while its content swaps behind a short blur. A cursor drives
// every change. 120 BPM, 8 bars, loops: the last frame equals the first, cursor included.
//
// logo → CTA → email (typed) → loader → success → dashboard → chart draws → tooltip → ⌘K → toast → logo
import { frameHold, spring, track, trackN, clamp, range, lerp, hash, loopT, swapAlpha, typed, indicator, beatPulse, SPRING } from '/lib/motion.js';
import { boot } from '/lib/stage.js';

const DUR = 16, BPM = 120;
const b = (n) => (60 / BPM) * n;
const P = { bg: '#EEEAE2', ink: '#1B1A18', dim: '#8B857A', line: '#DDD7CC', white: '#FFFFFF', accent: '#2F5BFF' };
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const K = [240, 28];                                           // container spring: at most a tiny overshoot

// The state list on the beat grid: [beat, w, h, radius, fill]
const STATES = [
  [0, 180, 180, 52, P.accent],     // logo
  [2, 440, 120, 60, P.ink],        // CTA button
  [4, 700, 120, 28, P.white],      // email field
  [7, 120, 120, 60, P.white],      // loader
  [9, 170, 170, 85, P.accent],     // success
  [11, 760, 300, 36, P.white],     // dashboard card
  [13, 760, 600, 36, P.white],     // chart draws itself (+ tooltip at 15)
  [18, 720, 470, 28, P.white],     // ⌘K palette
  [23, 600, 116, 58, P.ink],       // toast
  [27, 180, 180, 52, P.accent],    // logo
  [28.5, 540, 180, 52, P.accent],  // logo + wordmark
  [30, 180, 180, 52, P.accent],    // logo (= frame 0)
];
const key = (j) => STATES.map((s) => [b(s[0]), s[j]]);
const PRESSES = [2, 4, 7, 11, 13, 22.5, 27].map(b);
const ROWS = ['Render final.mp4', 'Render stills', 'Render draft', 'Open preview'];

// Chart points in card space (units): 12 days, seeded
const chartPt = (i) => [-320 + i * (640 / 11), 190 - (60 + 150 * (0.35 + 0.5 * (i / 11) + 0.25 * hash(i, 4))) * 0.9];

function content(t, S, w, h) {
  const { g, u } = S;
  const blurred = (a, fn) => {                               // content swaps behind a short blur
    if (a <= 0.001) return;
    g.save(); g.globalAlpha = a; if (a < 0.999) g.filter = `blur(${((1 - a) * 10 * u).toFixed(2)}px)`;
    fn(); g.restore();
  };
  const T = (n) => b(n);

  // logo mark (+ wordmark at 28.5)
  blurred(Math.max(swapAlpha(t, -1, T(2)), swapAlpha(t, T(27))), () => {
    const word = swapAlpha(t, T(28.5), T(30));
    const shift = track(t, [[0, 0], [T(28.5), -170], [T(30), 0]], ...K) * u;
    g.strokeStyle = P.white; g.lineWidth = 16 * u; g.lineCap = 'round';
    g.beginPath(); g.arc(shift, 0, 40 * u, Math.PI * 0.25, Math.PI * 1.95); g.stroke();
    g.fillStyle = P.white; g.beginPath(); g.arc(shift + 40 * u * Math.cos(Math.PI * 0.25), 40 * u * Math.sin(Math.PI * 0.25), 8 * u, 0, 7); g.fill();
    S.text('morph', shift + 80 * u, 26 * u, { size: 84, weight: 700, face: 'display', color: P.white, alpha: word, tracking: -0.02 });
  });

  blurred(swapAlpha(t, T(2), T(4)), () => S.text('Get started  →', 0, 14 * u, { size: 40, weight: 600, color: P.white, align: 'center' }));

  blurred(swapAlpha(t, T(4), T(7)), () => {
    const str = typed('you@studio.dev', t - T(4.6), 11);
    const x0 = -w / 2 + 44 * u;
    if (!str) S.text('Your email', x0, 14 * u, { size: 38, color: P.dim });
    const tw = S.text(str, x0, 14 * u, { size: 38, weight: 500, color: P.ink });
    if (Math.floor(t * 3) % 2 === 0 || str.length < 14) { g.fillStyle = P.accent; g.fillRect(x0 + tw + 4 * u, -24 * u, 4 * u, 48 * u); }
    g.fillStyle = P.ink; S.rrect(w / 2 - 190 * u, -40 * u, 160 * u, 80 * u, 22 * u); g.fill();
    S.text('Join', w / 2 - 110 * u, 12 * u, { size: 34, weight: 600, color: P.white, align: 'center' });
  });

  blurred(swapAlpha(t, T(7), T(9)), () => {
    g.strokeStyle = P.accent; g.lineWidth = 10 * u; g.lineCap = 'round';
    const a0 = t * 7; g.beginPath(); g.arc(0, 0, 32 * u, a0, a0 + Math.PI * 1.3); g.stroke();
  });

  blurred(swapAlpha(t, T(9), T(11)), () => {
    const d = range(t, T(9) + 0.12, T(9) + 0.42);
    g.strokeStyle = P.white; g.lineWidth = 14 * u; g.lineCap = 'round'; g.lineJoin = 'round';
    const pts = [[-30, 2], [-8, 24], [32, -20]].map(([x, y]) => [x * u, y * u]);
    const l1 = Math.hypot(22, 22), l2 = Math.hypot(40, 44), L = d * (l1 + l2);
    g.beginPath(); g.moveTo(...pts[0]);
    if (L <= l1) g.lineTo(lerp(pts[0][0], pts[1][0], L / l1), lerp(pts[0][1], pts[1][1], L / l1));
    else { g.lineTo(...pts[1]); const q = (L - l1) / l2; g.lineTo(lerp(pts[1][0], pts[2][0], q), lerp(pts[1][1], pts[2][1], q)); }
    if (d > 0) g.stroke();
  });

  blurred(swapAlpha(t, T(11), T(18)), () => {                // dashboard, then the chart draws itself
    const top = -h / 2;
    S.text('Renders this week', -w / 2 + 48 * u, top + 76 * u, { size: 30, weight: 500, color: P.dim });
    const n = Math.round(1284 * spring(frameHold(t) - T(11.2), [70, 18]));
    const nw = S.text(n.toLocaleString('en-US'), -w / 2 + 44 * u, top + 180 * u, { size: 96, weight: 700, face: 'display', color: P.ink, tracking: -0.02 });
    S.text('+18%', -w / 2 + 44 * u + nw + 24 * u, top + 176 * u, { size: 32, weight: 600, color: P.accent, alpha: swapAlpha(t, T(12)) });
    const d = range(t, T(13.2), T(14.6));
    if (d <= 0) return;
    const oy = top + 300 * u;
    g.save(); g.translate(0, oy);
    g.fillStyle = P.line; g.fillRect(-320 * u, 190 * u, 640 * u * spring(t - T(13), SPRING.default), 2 * u);
    const upto = d * 11, pts = [];
    for (let i = 0; i <= Math.floor(upto); i++) pts.push(chartPt(i));
    if (upto < 11) { const a = chartPt(Math.floor(upto)), c = chartPt(Math.ceil(upto)), f = upto % 1; pts.push([lerp(a[0], c[0], f), lerp(a[1], c[1], f)]); }
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x * u, y * u) : g.moveTo(x * u, y * u)));
    g.lineTo(pts[pts.length - 1][0] * u, 190 * u); g.lineTo(-320 * u, 190 * u); g.closePath();
    g.fillStyle = 'rgba(47,91,255,0.10)'; g.fill();
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x * u, y * u) : g.moveTo(x * u, y * u)));
    g.strokeStyle = P.accent; g.lineWidth = 6 * u; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke();

    const hover = spring(t - T(15.2), SPRING.snappy) * (1 - spring(t - T(17.6), SPRING.snappy));   // tooltip on hover
    if (hover > 0.01) {
      const [px, py] = chartPt(8);
      g.strokeStyle = P.line; g.lineWidth = 2 * u; g.beginPath(); g.moveTo(px * u, py * u); g.lineTo(px * u, 190 * u); g.stroke();
      g.fillStyle = P.white; g.strokeStyle = P.accent; g.lineWidth = 6 * u;
      g.beginPath(); g.arc(px * u, py * u, (8 + 6 * hover) * u, 0, 7); g.fill(); g.stroke();
      g.save(); g.translate(px * u, (py - 50) * u); g.scale(hover, hover); g.globalAlpha = clamp(hover * 1.5);
      g.fillStyle = P.ink; S.rrect(-130 * u, -74 * u, 260 * u, 64 * u, 16 * u); g.fill();
      S.text('Thu · 212 renders', 0, -32 * u, { size: 26, weight: 600, color: P.white, align: 'center' });
      g.restore();
    }
    g.restore();
  });

  blurred(swapAlpha(t, T(18), T(23)), () => {                // ⌘K palette with a stretching highlight
    const top = -h / 2, x0 = -w / 2 + 40 * u;
    const q = typed('render', t - T(18.4), 12);
    g.strokeStyle = P.dim; g.lineWidth = 4 * u; g.beginPath(); g.arc(x0 + 16 * u, top + 62 * u, 14 * u, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(x0 + 26 * u, top + 72 * u); g.lineTo(x0 + 36 * u, top + 82 * u); g.stroke();
    const qw = S.text(q || 'Search commands', x0 + 60 * u, top + 76 * u, { size: 36, weight: q ? 500 : 400, color: q ? P.ink : P.dim });
    if (q.length < 6 || Math.floor(t * 3) % 2 === 0) { g.fillStyle = P.accent; g.fillRect(x0 + 60 * u + (q ? qw : 0) + 4 * u, top + 44 * u, 4 * u, 44 * u); }
    g.fillStyle = P.bg; S.rrect(w / 2 - 110 * u, top + 42 * u, 70 * u, 46 * u, 12 * u); g.fill();
    S.text('⌘K', w / 2 - 75 * u, top + 74 * u, { size: 24, weight: 600, color: P.dim, align: 'center' });
    g.fillStyle = P.line; g.fillRect(-w / 2, top + 120 * u, w, 2 * u);
    const rowY = (i) => top + 150 * u + i * 76 * u;
    const hl = indicator(t, [[0, rowY(0)], [T(19), rowY(1)], [T(20), rowY(2)], [T(21), rowY(0)]], 64 * u);
    g.fillStyle = 'rgba(47,91,255,0.10)'; S.rrect(-w / 2 + 20 * u, hl.left, w - 40 * u, hl.right - hl.left, 16 * u); g.fill();
    ROWS.forEach((r, i) => {
      const shown = spring(t - T(18.8) - i * 0.05, SPRING.snappy);
      const y = rowY(i) + 44 * u + (1 - shown) * 16 * u;
      g.globalAlpha = shown;
      g.fillStyle = i === 3 ? P.line : 'rgba(47,91,255,0.25)'; S.rrect(x0, y - 30 * u, 36 * u, 36 * u, 10 * u); g.fill();
      S.text(r, x0 + 60 * u, y, { size: 32, weight: 500, color: P.ink });
      g.globalAlpha = 1;
    });
  });

  blurred(swapAlpha(t, T(23), T(27)), () => {                // toast
    g.fillStyle = P.accent; g.beginPath(); g.arc(-w / 2 + 62 * u, 0, 26 * u, 0, 7); g.fill();
    g.strokeStyle = P.white; g.lineWidth = 6 * u; g.lineCap = 'round'; g.beginPath();
    g.moveTo(-w / 2 + 50 * u, 0); g.lineTo(-w / 2 + 59 * u, 9 * u); g.lineTo(-w / 2 + 75 * u, -9 * u); g.stroke();
    S.text('Exported final.mp4', -w / 2 + 108 * u, 12 * u, { size: 36, weight: 600, color: P.white });
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(-w / 2 + 40 * u, h / 2 - 16 * u, (w - 80 * u) * (1 - range(t, T(23.5), T(26.8))), 4 * u);
  });
}

boot({
  title: 'UI Morph Loop', dur: DUR, bpm: BPM, loop: true, formats: ['9:16', '16:9'], palette: P, poster: b(15.8),
  music: { style: 'minimal', key: 'D', seed: 2 },
  cues: [
    ...PRESSES.map((t) => ({ t: t - 0.03, type: 'click' })),
    ...[2, 4, 7, 11, 13, 18, 23, 27, 28.5, 30].map((n) => ({ t: b(n), type: 'pop', gain: 0.55 })),
    ...Array.from({ length: 14 }, (_, i) => ({ t: b(4.6) + i / 11, type: 'type', gain: 0.7 })),
    { t: b(9), type: 'chime' },
    ...Array.from({ length: 12 }, (_, i) => ({ t: b(13.2) + i * ((b(14.6) - b(13.2)) / 11), type: 'tick', gain: 0.35 })),
    { t: b(15.2), type: 'pop', gain: 0.4 },
    ...Array.from({ length: 6 }, (_, i) => ({ t: b(18.4) + i / 12, type: 'type', gain: 0.6 })),
    ...[19, 20, 21].map((n) => ({ t: b(n), type: 'swipe', gain: 0.5 })),
    { t: b(23), type: 'chime', gain: 0.6 },
  ],
  draw(tt, S) {
    const { g, W, H, u } = S;
    const t = loopT(tt, DUR);
    const zoom = S.pick({ portrait: 1.32, square: 1.12, landscape: 1.15 });
    g.translate(W / 2, H / 2); g.scale(zoom, zoom);

    // quiet dot grid: gives the canvas depth without chrome
    g.fillStyle = P.line;
    const step = 48 * u, span = Math.max(W, H) / zoom;
    for (let x = -span / 2; x < span / 2; x += step) for (let y = -span / 2; y < span / 2; y += step) g.fillRect(x, y, 3 * u, 3 * u);

    const press = PRESSES.reduce((a, p) => a + spring(t - p + 0.05, SPRING.snappy) - spring(t - p - 0.07, SPRING.snappy), 0);
    const pulse = t > b(27) ? beatPulse(t, BPM, { decay: 8 }) * 0.02 * (1 - range(t, b(30), b(31.5))) : 0;
    const w = track(t, key(1), ...K) * u, h = track(t, key(2), ...K) * u, r = track(t, key(3), ...K) * u;
    const fill = STATES.map((s) => [b(s[0]), rgb(s[4])]);
    const [cr, cg, cb] = trackN(t, fill, ...K).map((v) => Math.round(clamp(v, 0, 255)));
    const s = 1 - 0.035 * press + pulse;
    g.save(); g.scale(s, s);
    g.fillStyle = 'rgba(27,26,24,0.06)'; S.rrect(-w / 2, -h / 2 + 10 * u, w, h, r); g.fill();   // contact shadow, not a glow
    g.fillStyle = `rgb(${cr},${cg},${cb})`; S.rrect(-w / 2, -h / 2, w, h, r); g.fill();
    if (cr > 200) { g.strokeStyle = P.line; g.lineWidth = 2 * u; g.stroke(); }
    g.save(); S.rrect(-w / 2, -h / 2, w, h, r); g.clip();
    content(t, S, w, h);
    g.restore(); g.restore();

    // the cursor drives every change; it ends where it started
    const REST = [300, 420];
    const cur = trackN(t, [[0, REST], [b(1.2), [20, 30]], [b(3.2), [120, 30]], [b(4.4), [420, 200]], [b(6.3), [310, 20]],
      [b(8), [260, 240]], [b(10.3), [30, 30]], [b(12.2), [220, 120]], [b(14.6), [chartPt(8)[0] + 10, chartPt(8)[1] + 10]],
      [b(17.4), [380, 360]], [b(21.9), [-120, -50]], [b(24), [360, 220]], [b(26.3), [60, 20]],
      [b(28.2), [340, 300]], [b(29.4), REST]], 110, 22);
    const cs = (1.5 - 0.2 * press) * u;
    g.save(); g.translate(cur[0] * u, cur[1] * u); g.scale(cs, cs);
    g.beginPath(); [[0, 0], [0, 34], [9, 26], [15, 40], [21, 37], [15, 24], [26, 24]].forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.closePath(); g.fillStyle = P.ink; g.fill(); g.strokeStyle = P.white; g.lineWidth = 2.5; g.stroke();
    g.restore();
  },
});
</script>
